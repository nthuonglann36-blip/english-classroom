<style>

rap}.options button{background:var(--card);color:var(--ink);font-size:26px;flex:1 1 260px;min-height:58px}.options button:disabled{opacity:1}.options button.chosen{border-width:4px;box-shadow:inset 0 0 0 2px var(--paper);font-weight:700}.feedback{font-size:26px;line-height:1.22;min-height:64px;display:flex;align-items:center}.feedback:empty{visibility:hidden}.timeline-slot{height:92px;flex:none}.timeline{width:100%;height:92px;display:block}.timeline .run{transform-box:fill-box;transform-origin:left;animation:grow 1.45s ease-out both}.timeline .tail{transform-box:fill-box;transform-origin:left;animation:continue .8s 1.4s ease-out both}.timeline .flash{transform-box:fill-box;transform-origin:center;animation:land .3s 1.32s ease-out both}.timeline.parallel .run{animation-duration:1.8s}.timeline.parallel .run.second{animation-delay:.12s}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes continue{0%{transform:scaleX(0);opacity:1}70%{opacity:1}100%{transform:scaleX(1);opacity:.35}}@keyframes land{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}.brush{transform-box:fill-box;transform-origin:center;animation:brush 1.5s ease-in-out infinite alternate}.cloud{animation:cloud 7s ease-in-out infinite alternate}.rain{animation:rain 1.5s 1.2s ease-out infinite}.ball{animation:ball 3s ease-in-out infinite}.dog{animation:dog 2.6s ease-in-out infinite alternate}.cook{animation:brush 2s ease-in-out infinite alternate}@keyframes brush{to{transform:rotate(10deg)}}@keyframes cloud{to{transform:translateX(-18px)}}@keyframes rain{from{opacity:0;transform:translateY(-10px)}50%{opacity:.65}to{opacity:0;transform:translateY(18px)}}@keyframes ball{0%,15%{transform:translate(0,0)}65%,100%{transform:translate(145px,40px)}}@keyframes dog{to{transform:translateX(-55px)}}.rule{font-size:40px;line-height:1.25}.blank{border-bottom:3px solid var(--ink);padding:0 10px}.summary{padding:20px 24px;background:var(--card);border:2px solid var(--line);border-radius:16px;display:grid;gap:18px}.summary p{font-size:40px;line-height:1.2}.small-note{font-size:26px;line-height:1.25}.writing{gap:10px}.writing label.pattern{display:block;font-size:40px;line-height:1.15}.writing textarea{width:100%;height:62px;min-height:62px;resize:none;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;color:var(--ink);background:var(--card);font-size:26px;line-height:1.25}.checks{display:grid;gap:8px;border:0;padding:0;margin:0}.checks legend{font-size:26px;margin-bottom:8px;font-weight:700}.checks label{display:flex;align-items:flex-start;gap:12px;font-size:26px;line-height:1.2}.checks input{width:28px;height:28px;flex:none;accent-color:var(--ink);margin:0}footer{padding:10px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:2px solid var(--line);background:var(--paper)}#teacher{font-size:26px;padding:8px 12px}#teacher[hidden]{visibility:hidden;display:block}footer>button:first-child,footer>button:last-child{min-width:130px}dialog{width:min(1100px,calc(100% - 32px));max-height:90dvh;overflow:auto;border:3px solid var(--ink);border-radius:16px;background:var(--paper);color:var(--ink);padding:24px;font-size:26px}dialog::backdrop{background:rgba(35,41,73,.65)}dialog h2,dialog p{margin-bottom:18px}dialog .sentence{font-size:40px}dialog button{float:right}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}[hidden]{display:none!important}
@media(max-width:800px),(max-height:650px){body{grid-template-rows:auto 7px minmax(0,1fr) auto}header{padding:10px 16px;flex-wrap:wrap;gap:6px}header strong{font-size:26px}main{overflow-y:auto;padding:16px}.screen{justify-content:flex-start;min-height:100%;gap:16px}.scene{height:160px}.scene.hook{height:240px}footer{padding:10px 12px;flex-wrap:wrap;gap:8px}#teacher{order:3;flex-basis:100%;min-height:48px}#teacher[hidden]{display:none}footer>button:first-child,footer>button:last-child{min-width:110px}.options{flex-direction:column}.options button{flex:auto}.sentence-stack{gap:16px}.sentence-stack .sentence{padding:10px}.timeline-slot,.timeline{height:78px}.sentence,.sentence button,.rule,.summary p,.writing label.pattern{font-size:40px}.summary{padding:16px}.writing textarea{height:100px;min-height:100px}.checks{gap:16px}#position{white-space:normal}}

<body>

<div class="progress" id="progress" role="progressbar" aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div>

<dialog id="model"><h2>One possible story</h2><p class="sentence">I was carrying some books when I dropped one.</p><p class="sentence">While I was helping my neighbour, my friend called.</p><p>These are examples, not marks. Write your own story and use the self-check.</p><button id="close-model" type="button">Close</button></dialog>

(function(){

let current=0, finished=false;
const states={}, draft={first:'',second:'',checks:[false,false,false]};
const characterDefs=`<defs><g id="mai"><path d="M-16-64Q-36-62-31-35L-17-43Z" fill="#353744"/><circle cy="-54" r="17" fill="#dcc3a9"/><path d="M-17-56Q-18-80 4-75Q21-73 18-51L9-64-16-56" fill="#353744"/><path d="M-23-28Q0-38 23-28L20 14H-20Z" fill="#66826c"/><path d="M-12 14L-14 48M12 14L15 48" stroke="#3e4354" stroke-width="11"/><path d="M-21-22L-35 3M21-22L36-3" stroke="#dcc3a9" stroke-width="9" stroke-linecap="round"/><circle cx="-6" cy="-54" r="1.5"/><circle cx="7" cy="-54" r="1.5"/><path d="M-5-46Q1-41 7-46" fill="none" stroke="#53515a" stroke-width="2"/></g><g id="nam"><circle cy="-54" r="17" fill="#dcc3a9"/><path d="M-17-54L-17-69Q-1-83 17-67L19-52 7-64-15-58" fill="#353744"/><path d="M-23-28Q0-38 23-28L20 14H-20Z" fill="#66826c"/><path d="M-12 14L-14 48M12 14L15 48" stroke="#3e4354" stroke-width="11"/><path d="M-21-22L-35 3M21-22L36-3" stroke="#dcc3a9" stroke-width="9" stroke-linecap="round"/><circle cx="-6" cy="-54" r="1.5"/><circle cx="7" cy="-54" r="1.5"/><path d="M-5-46Q1-41 7-46" fill="none" stroke="#53515a" stroke-width="2"/></g></defs>`;
function scene(kind){
 let art='';
 if(kind==='paint')art=`<path d="M0 154L140 24 255 154 374 53 493 154 640 25 800 154 950 40 1000 154" fill="#e4e5df"/><path d="M145 108L232 64 320 108Z" fill="#8d9198"/><path d="M158 108H307V213H158Z" fill="#f0ede3" stroke="#535b72" stroke-width="3"/><path d="M110 138H700V246H110Z" fill="#eeede4" stroke="#535b72" stroke-width="3"/><path d="M110 163H700M110 190H700M110 218H700" stroke="#d2d3cd" stroke-width="3"/><path d="M350 157H410V211H350Z" fill="#bdc7bb"/><use href="#mai" transform="translate(340 192)"/><use href="#nam" transform="translate(520 192)"/><g class="brush"><path d="M374 180L390 151" stroke="#535b72" stroke-width="7"/><path d="M380 141H405V156H380Z" fill="#aebca9"/></g><g class="brush"><path d="M551 179L571 157" stroke="#535b72" stroke-width="7"/><path d="M562 144H587V160H562Z" fill="#aebca9"/></g><path d="M444 216H480L475 247H450Z" fill="#b8bec3" stroke="#535b72" stroke-width="3"/><path d="M444 219Q461 190 480 219" fill="none" stroke="#535b72" stroke-width="3"/><g class="cloud" fill="#838794"><ellipse cx="746" cy="63" rx="72" ry="24"/><ellipse cx="709" cy="46" rx="34" ry="29"/><ellipse cx="768" cy="39" rx="43" ry="31"/></g><g class="rain" stroke="#9298a3" stroke-width="4"><path d="M705 98L698 122M746 99L739 123M785 96L778 120"/></g>`;
 if(kind==='ball')art=`<path d="M0 246H1000" stroke="#bac3b8" stroke-width="8"/><path d="M60 125L160 42 260 125 370 40 470 125" fill="#e4e5df"/><path d="M130 90H310V226H130Z" fill="#efede4" stroke="#535b72" stroke-width="3"/><path d="M110 90L220 34 330 90Z" fill="#8d9198"/><use href="#mai" transform="translate(220 190)"/><use href="#nam" transform="translate(423 194) scale(.8)"/><use href="#mai" transform="translate(590 194) scale(.75)"/><g class="ball"><circle cx="610" cy="180" r="18" fill="#fffefa" stroke="#535b72" stroke-width="4"/><path d="M606 167L619 175 614 187 600 185 597 174Z" fill="#535b72"/></g><path d="M758 214H804L798 249H765Z" fill="#bdc7bb" stroke="#535b72" stroke-width="4"/><path d="M758 214Q780 187 804 214" fill="none" stroke="#535b72" stroke-width="3"/>`;
 if(kind==='dog')art=`<path d="M0 245H1000" stroke="#bac3b8" stroke-width="8"/><path d="M50 150L180 35 310 150 430 48 580 150 780 26 1000 150" fill="#e4e5df"/><path d="M90 118H260V228H90Z" fill="#eeede4" stroke="#535b72" stroke-width="3"/><path d="M75 118L175 58 275 118Z" fill="#8d9198"/><use href="#nam" transform="translate(495 190)"/><path d="M464 155H525V196H464Z" fill="#d9cbb6" stroke="#535b72" stroke-width="3"/><path d="M470 154V139H484V154M488 154V135H501V154M505 154V141H519V154" fill="#90999c" stroke="#535b72" stroke-width="2"/><g class="dog"><path d="M649 216Q673 194 718 207L733 220 725 234H650Z" fill="#c3b7a5" stroke="#535b72" stroke-width="3"/><circle cx="649" cy="208" r="18" fill="#c3b7a5" stroke="#535b72" stroke-width="3"/><path d="M649 194L660 185 664 211" fill="#89857f"/><path d="M633 210H621" stroke="#535b72" stroke-width="7"/><circle cx="642" cy="204" r="2"/><path d="M661 231L650 248M710 231L720 248M730 218Q754 204 746 194" fill="none" stroke="#535b72" stroke-width="6"/></g>`;
 if(kind==='parallel')art=`<path d="M500 12V255" stroke="#d8d9df" stroke-width="3"/><path d="M60 42H296V150H60Z" fill="#e9ece5" stroke="#535b72" stroke-width="3"/><path d="M84 72H246M84 101H205" stroke="#a8b4a5" stroke-width="7"/><use href="#mai" transform="translate(324 192)"/><use href="#nam" transform="translate(135 218) scale(.6)"/><use href="#mai" transform="translate(240 221) scale(.6)"/><path d="M584 208H915V225H584Z" fill="#dad2c4" stroke="#535b72" stroke-width="3"/><path d="M620 225V255M878 225V255" stroke="#535b72" stroke-width="6"/><use href="#nam" transform="translate(755 174)"/><path d="M790 185H868L859 208H800Z" fill="#b1b8ba" stroke="#535b72" stroke-width="3"/><path d="M786 185H874" stroke="#535b72" stroke-width="5"/><g class="cook"><path d="M793 163L826 192" stroke="#535b72" stroke-width="5"/></g><path d="M828 166Q815 154 827 144M845 166Q832 152 846 140" fill="none" stroke="#abb0b7" stroke-width="4"/>`;
 return `<figure class="scene ${kind==='hook'?'hook':''}" role="img" aria-label="${{paint:'Mai and Nam painting a school wall in a mountain village as dark clouds gather.',ball:'Children playing football near a paint bucket in a mountain village.',dog:'Nam carrying a box of books as a dog runs towards him in a mountain village.',parallel:'Mai teaching children on the left; Nam cooking lunch on the right.'}[kind]}"><svg viewBox="0 0 1000 270" aria-hidden="true">${characterDefs}${art}</svg></figure>`;
}
function timeline(parallel=false){
 return `<div class="timeline-slot"><svg class="timeline ${parallel?'parallel':''}" viewBox="0 0 1120 92" role="img" aria-label="${parallel?'Two activities happening at the same time.':'One activity starts earlier; another event happens during it; the first activity continues briefly.'}"><path d="M28 69H1085L1070 59M1085 69L1070 79" fill="none" stroke="#232949" stroke-width="3"/><rect class="run" x="95" y="${parallel?12:28}" width="${parallel?810:510}" height="18" rx="6" fill="#1769E0"/>${parallel?'<rect class="run second" x="95" y="40" width="810" height="18" rx="6" fill="#1769E0"/>':'<rect class="tail" x="605" y="28" width="210" height="18" rx="5" fill="#1769E0"/><path class="flash" d="M624 3L594 35H613L601 61 643 24H623Z" fill="#F07800"/>'}</svg></div>`;
}
const stories=[
 {scene:'paint',sentence:'<span class="long">Mai and Nam <strong>were painting</strong> the school wall</span> <span class="linker">when</span> <span class="short">it <strong>started</strong> to rain.</span>',first:'Mai and Nam <strong>were painting</strong> the school wall',second:'it <strong>started</strong> to rain.',link:'when',long:0,hint:'Think about what they were already doing. Which action could take several minutes?'},
 {scene:'ball',sentence:'<span class="linker">While</span> <span class="long">the children <strong>were playing</strong> football,</span> <span class="short">the ball <strong>hit</strong> the paint bucket.</span>',first:'the children <strong>were playing</strong> football,',second:'the ball <strong>hit</strong> the paint bucket.',link:'While',long:0,hint:'Imagine the two actions. Which one was already happening?'},
 {scene:'dog',sentence:'<span class="long">Nam <strong>was carrying</strong> a box of books</span> <span class="linker">when</span> <span class="short">a dog <strong>ran</strong> into him.</span>',first:'Nam <strong>was carrying</strong> a box of books',second:'a dog <strong>ran</strong> into him.',link:'when',long:0,hint:'Imagine Nam before the surprise. Which activity took time?'}
];
const pair='<p class="sentence"><span class="long">Mai and Nam were painting the wall</span> <span class="linker">when</span> <span class="short">it started to rain.</span></p><p class="sentence"><span class="linker">While</span> <span class="long">Mai and Nam were painting the wall,</span> <span class="short">it started to rain.</span></p>';
const two='<span class="linker">While</span> <span class="long">Mai <strong>was teaching</strong> the children,</span> <span class="long">Nam <strong>was cooking</strong> lunch.</span>';
const pages=[
 {step:1,kind:'hook',label:'Hook'},
 ...stories.map((story,i)=>({step:2,kind:'story',story:i,label:'Story '+(i+1)+' of 3'})),
 {step:3,kind:'verbs',label:'Look at the verbs · 1 of 2',question:'What do the blue verbs look like?',options:['was/were + V-ing','past form of the verb'],answer:0,hint:'Compare the blue words in all three sentences.'},
 {step:3,kind:'verbs',label:'Look at the verbs · 2 of 2',question:'What do the orange verbs look like?',options:['was/were + V-ing','past form of the verb'],answer:1,hint:'Compare the orange words in all three sentences.'},
 {step:4,kind:'pair',label:'Same story · 1 of 4',question:'Do they mean the same?',options:['Yes','No'],answer:0,hint:'Check who does each action in both sentences.'},
 {step:4,kind:'pair',label:'Same story · 2 of 4',question:"Which action comes right after 'when'?",options:['the short action','the long action'],answer:0,hint:'Find when in the first sentence. Read the words immediately after it.'},
 {step:4,kind:'pair',label:'Same story · 3 of 4',question:"Which action comes right after 'while'?",options:['the short action','the long action'],answer:1,hint:'Find While in the second sentence. Read the words immediately after it.'},
 {step:4,kind:'pair',label:'Same story · 4 of 4',question:'When do we need a comma?',options:['when the when/while part comes first','when the when/while part comes second'],answer:0,hint:'Look for the comma in the two examples.'},
 {step:5,kind:'two',label:'A new case · 1 of 2',question:'How many long actions are there?',options:['1','2'],answer:1,hint:'Look at both halves of the picture. What is each person doing?'},
 {step:5,kind:'two',label:'A new case · 2 of 2',question:'What form do both verbs use?',options:['was/were + V-ing','past form of the verb'],answer:0,hint:'Look closely at the verbs next to Mai and Nam.'},
 {step:6,kind:'rule',label:'You write the rule · 1 of 5',before:'A longer action in progress uses the ',after:'.',options:['past continuous','past simple'],answer:0,hint:'Look back at the blue action and its verb form.'},
 {step:6,kind:'rule',label:'You write the rule · 2 of 5',before:'A short action that happens during it uses the ',after:'.',options:['past simple','past continuous'],answer:0,hint:'Think about started, hit and ran in the stories.'},
 {step:6,kind:'rule',label:'You write the rule · 3 of 5',before:'"when" usually comes before the ',after:' action.',options:['short','long'],answer:0,hint:'Remember the first sentence about painting and rain.'},
 {step:6,kind:'rule',label:'You write the rule · 4 of 5',before:'"while" usually comes before the ',after:' action.',options:['long','short'],answer:0,hint:'Remember the sentence that starts with While.'},
 {step:6,kind:'rule',label:'You write the rule · 5 of 5',before:'Two long actions at the same time: while + ',after:', past continuous.',options:['past continuous','past simple'],answer:0,hint:'Think about Mai teaching and Nam cooking at the same time.'},
 {step:6,kind:'summary',label:'Your discovery'},
 {step:7,kind:'check',label:'Check yourself · 1 of 4',stem:'___ Lan was washing the dishes, she broke a plate.',result:'<span class="linker">While</span> <span class="long">Lan was washing the dishes,</span> <span class="short">she broke a plate.</span>',options:['While','When'],answer:0,also:1,hint:'Think about the action after the gap.'},
 {step:7,kind:'check',label:'Check yourself · 2 of 4',stem:'The volunteers were singing ___ the lights went out.',result:'<span class="long">The volunteers were singing</span> <span class="linker">when</span> <span class="short">the lights went out.</span>',options:['when','while'],answer:0,hint:'The singing was already happening. Think about the lights.'},
 {step:7,kind:'check',label:'Check yourself · 3 of 4',stem:'Mai ___ to an old man when her phone ___.',result:'<span class="long">Mai was talking to an old man</span> <span class="linker">when</span> <span class="short">her phone rang.</span>',options:['was talking / rang','talked / was ringing','talked / rang'],answer:0,hint:'Which activity was already happening before the phone made a sound?'},
 {step:7,kind:'check',label:'Check yourself · 4 of 4',stem:'While the boys ___ the yard, the girls ___ flowers.',result:'<span class="linker">While</span> <span class="long">the boys were cleaning the yard,</span> <span class="long">the girls were planting flowers.</span>',options:['were cleaning / were planting','cleaned / were planting','cleaned / planted'],answer:0,parallel:true,hint:'Picture the two groups working at the same time.'},
 {step:8,kind:'writing',label:'Your story'}
];
function state(){return states[current]||(states[current]={done:false,choice:null,feedback:''});}
function escapeText(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function options(page,s){return '<div class="options" role="group" aria-label="Choose an answer">'+page.options.map((text,i)=>`<button type="button" data-choice="${i}" class="${s.done&&s.choice===i?'chosen':''}" ${s.done?'disabled':''} aria-pressed="${s.done&&s.choice===i}">${escapeText(text)}</button>`).join('')+'</div>';}
function feedback(s){return `<p class="feedback">${escapeText(s.feedback)}</p>`;}
function storyMarkup(story,s){
 const first=`<button type="button" data-action="0" class="long" ${s.done?'disabled':''}>${story.first}</button>`,second=`<button type="button" data-action="1" class="short" ${s.done?'disabled':''}>${story.second}</button>`,link=`<span class="linker">${story.link}</span>`;
 return `<h2 id="screen-title" tabindex="-1">Tap the action that lasted longer.</h2>${scene(story.scene)}<p class="sentence ${s.done?'coloured':''}">${story.link==='While'?link+' '+first+' '+second:first+' '+link+' '+second}</p>${s.done?timeline():'<div class="timeline-slot" aria-hidden="true"></div>'}${feedback(s)}`;
}
function render(keepScroll=false){
 const previousScroll=keepScroll?main.scrollTop:0;
 const page=pages[current],s=state();$('position').textContent='Step '+page.step+' · '+page.label;
 const percent=finished?100:Math.round(current/pages.length*100);$('progress-fill').style.width=percent+'%';$('progress').setAttribute('aria-valuenow',percent);$('progress').setAttribute('aria-valuetext','Step '+page.step+' of 8');
 let body='';
 if(finished){body='<h1 id="screen-title" tabindex="-1">Your story is ready to share.</h1><p class="sentence">Tell a partner about the time you helped someone.</p><p>Use Back to edit your story, or Review to visit the lesson again.</p>';}
 else if(page.kind==='hook'){body='<h1 id="screen-title" tabindex="-1">What happened to Mai and Nam last Sunday?</h1>'+scene('paint').replace('class="scene "','class="scene hook"')+'<p>Watch, notice and discover.</p>';}
 else if(page.kind==='story'){body=storyMarkup(stories[page.story],s);}
 else if(page.kind==='verbs'){body=`<h2 id="screen-title" tabindex="-1">${page.question}</h2><div class="sentence-stack coloured">${stories.map(story=>'<p class="sentence">'+story.sentence+'</p>').join('')}</div>${options(page,s)}${feedback(s)}`;}
 else if(page.kind==='pair'){body=`<div class="sentence-stack coloured">${pair}</div><h2 id="screen-title" tabindex="-1">${page.question}</h2>${options(page,s)}${feedback(s)}`;}
 else if(page.kind==='two'){const coloured=current>0&&(pages[current-1].kind==='two')||s.done;body=`<h2 id="screen-title" tabindex="-1">${page.question}</h2>${scene('parallel')}<p class="sentence ${coloured?'coloured':''}">${two}</p>${options(page,s)}${coloured?timeline(true):'<div class="timeline-slot" aria-hidden="true"></div>'}${feedback(s)}`;}
 else if(page.kind==='rule'){body=`<h2 id="screen-title" tabindex="-1">${page.label}</h2><p class="rule">${escapeText(page.before)}<strong class="blank">${s.done?escapeText(page.options[s.choice]):'___'}</strong>${escapeText(page.after)}</p>${options(page,s)}${feedback(s)}`;}
 else if(page.kind==='summary'){body='<h1 id="screen-title" tabindex="-1">Keep these three patterns</h1><div class="summary"><p>while + past continuous, past simple</p><p>past continuous + when + past simple</p><p>while + past continuous, past continuous</p></div><p class="small-note">“when” usually comes before the short action.<br>“while” usually comes before the long action.</p>';}
 else if(page.kind==='check'){let sentence=page.result;if(page.also===s.choice)sentence=sentence.replace('>While<','>When<');body=`<h2 id="screen-title" tabindex="-1">Choose the best answer.</h2><p class="sentence ${s.done?'coloured':''}">${s.done?sentence:escapeText(page.stem)}</p>${options(page,s)}${s.done?timeline(!!page.parallel):'<div class="timeline-slot" aria-hidden="true"></div>'}${feedback(s)}`;}
 else if(page.kind==='writing'){body='<h1 id="screen-title" tabindex="-1">Think of a time you helped someone.</h1><div><label class="pattern" for="story-first">I was ___ when ___.</label><textarea id="story-first" aria-describedby="writing-note" placeholder="Write your first sentence here."></textarea></div><div><label class="pattern" for="story-second">While I was ___, ___.</label><textarea id="story-second" aria-describedby="writing-note" placeholder="Write your second sentence here."></textarea></div><fieldset class="checks"><legend>My self-check</legend>'+['I used was/were + V-ing for the long action.','I used the past form for the short action.','I used a comma if when/while came first.'].map((text,i)=>`<label><input type="checkbox" data-check="${i}">${text}</label>`).join('')+'</fieldset><p id="writing-note" class="small-note">Check your own writing. Nothing here is automatically marked.</p>';}
 main.innerHTML='<section class="screen '+(page.kind==='writing'&&!finished?'writing':'')+'">'+body+'</section>';
 if(page.kind==='writing'&&!finished){$('story-first').value=draft.first;$('story-second').value=draft.second;main.querySelectorAll('[data-check]').forEach(box=>box.checked=draft.checks[Number(box.dataset.check)]);}
 $('back').disabled=current===0&&!finished;$('teacher').hidden=finished||['hook','summary'].includes(page.kind);$('next').textContent=finished?'Review →':page.kind==='writing'?'Finish ✓':'Next →';updateLock();main.scrollTop=previousScroll;
}
function updateLock(){const kind=pages[current].kind;$('next').disabled=!finished&&!['hook','summary'].includes(kind)&&(kind==='writing'?!(draft.first.trim()&&draft.second.trim()&&draft.checks.every(Boolean)):!state().done);}
function announce(text){$('announcer').textContent='';requestAnimationFrame(()=>$('announcer').textContent=text);}
function answer(choice,teacher=false){
 const page=pages[current],s=state();if(s.done)return;
 const accepted=choice===page.answer||choice===page.also;
 if(accepted||teacher){s.done=true;s.choice=teacher?page.answer:choice;s.feedback=page.also===s.choice?"That is possible, but 'while' is the more usual choice before a long action.":teacher?'Here is the answer. Look closely, then continue.':'Good noticing! You can continue.';}
 else{s.feedback='Try again. '+page.hint;}
 const message=s.feedback;render(true);announce(message);
}
main.addEventListener('click',event=>{
 const button=event.target.closest('[data-action],[data-choice]');if(!button||button.disabled)return;const page=pages[current];
 if(page.kind==='story'){
  const s=state(),story=stories[page.story];if(Number(button.dataset.action)===story.long){s.done=true;s.choice=0;s.feedback='Good noticing! Watch the timeline.';}else{s.feedback='Try again. '+story.hint;}const message=s.feedback;render(true);announce(message);
 }else answer(Number(button.dataset.choice));
});
main.addEventListener('input',event=>{if(event.target.id==='story-first')draft.first=event.target.value;if(event.target.id==='story-second')draft.second=event.target.value;updateLock();});
main.addEventListener('change',event=>{if(event.target.matches('[data-check]')){draft.checks[Number(event.target.dataset.check)]=event.target.checked;updateLock();}});
function go(direction){
 if($('model').open)return;
 if(direction<0){if(finished){finished=false;}else if(current>0){current--;}else return;}
 else{if($('next').disabled)return;if(finished){finished=false;current=0;}else if(current===pages.length-1){finished=true;}else current++;}
 render();const heading=$('screen-title');if(heading)heading.focus({preventScroll:true});
}
$('back').addEventListener('click',()=>go(-1));$('next').addEventListener('click',()=>go(1));
$('teacher').addEventListener('click',()=>{const page=pages[current];if(page.kind==='writing'){$('model').showModal();return;}if(page.kind==='story'){const s=state();s.done=true;s.choice=0;s.feedback='Here is the answer. Watch the timeline.';render(true);announce(s.feedback);}else answer(page.answer,true);});
$('close-model').addEventListener('click',()=>$('model').close());
document.addEventListener('keydown',event=>{if(event.ctrlKey||event.altKey||event.metaKey||event.target.closest('input,textarea,select,[contenteditable="true"]')||$('model').open)return;if(event.key==='ArrowRight'){event.preventDefault();go(1);}if(event.key==='ArrowLeft'){event.preventDefault();go(-1);}});
render();
})();
</script>
</body>
</html>
