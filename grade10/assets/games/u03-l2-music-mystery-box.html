<body>
<script>
window.GAME = {
 "title": "Music Mystery Box",
 "sub": "Unit 3 · Lesson 2 · Review",
 "theme": "music",
 "mode": "board",
 "cols": 5,
 "rules": [
  "Play in 2–4 teams. Teams take turns to choose a number from 1 to 15.",
  "Answer correctly → open a mystery box with secret points.",
  "Keep the points or give them to another team (minus points make a nice gift!).",
  "Wrong answer → the turn goes to the next team."
 ],
 "boxes": [
  10,
  20,
  30,
  40,
  -10,
  -20,
  50,
  10,
  20
 ],
 "items": [
  {
   "q": "Which word has the stress on the SECOND syllable?",
   "opts": [
    "singer",
    "common",
    "perform",
    "careful"
   ],
   "a": 2
  },
  {
   "q": "Make a compound sentence with <i>and / but / or / so</i>:<br>He / play the guitar. &nbsp;She / sing.",
   "a": "He plays the guitar, and she sings."
  },
  {
   "q": "Their concert was cancelled, ______ the fans were very disappointed. <i>(and / so)</i>",
   "a": "so"
  },
  {
   "q": "Make a compound sentence with <i>and / but / or / so</i>:<br>It / rain. &nbsp;The fans / stay for the show.",
   "a": "It rained, but the fans stayed for the show."
  },
  {
   "q": "She hopes ______ a famous singer one day.",
   "opts": [
    "to become",
    "become",
    "becoming",
    "became"
   ],
   "a": 0
  },
  {
   "q": "Use the words to write a sentence:<br>I / like / pop music / my brother / prefer / rock music. <i>(but)</i>",
   "a": "I like pop music, but my brother prefers rock music."
  },
  {
   "q": "Make a compound sentence with <i>and / but / or / so</i>:<br>He / practise every day. &nbsp;He / win the competition.",
   "a": "He practised every day, so he won the competition."
  },
  {
   "q": "A person who decides on the results of a competition is a ______.",
   "a": "judge"
  },
  {
   "q": "Make a compound sentence with <i>and / but / or / so</i>:<br>You / watch the show on TV. &nbsp;You / watch it online.",
   "a": "You can watch the show on TV, or you can watch it online."
  },
  {
   "q": "Use the words to write a sentence:<br>Many famous artists / agree / perform / at the charity concert.",
   "a": "Many famous artists agreed to perform at the charity concert."
  },
  {
   "q": "Make a compound sentence with <i>and / but / or / so</i>:<br>She / talented. &nbsp;Her new single / a big hit.",
   "a": "She is talented, and her new single is a big hit."
  },
  {
   "q": "Use the words to write a sentence:<br>We / hear / her / sing / at the school party.",
   "a": "We heard her sing at the school party."
  },
  {
   "q": "The ______ clapped loudly after the song.",
   "opts": [
    "single",
    "stage",
    "award",
    "audience"
   ],
   "a": 3
  },
  {
   "q": "Her parents won’t let her (go) ______ to the concert alone.",
   "a": "go"
  },
  {
   "q": "Make a compound sentence with <i>and / but / or / so</i>:<br>The show was very long. &nbsp;We enjoyed every minute.",
   "a": "The show was very long, but we enjoyed every minute."
  }
 ]
};
</script>
<script src="_game.js"></script>
<script src="_board.js"></script>
</body>
