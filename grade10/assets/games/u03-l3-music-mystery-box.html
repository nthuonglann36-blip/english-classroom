  .modal-header{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:15px}
  .question-pill{display:inline-flex;align-items:center;gap:7px;color:#bdeafa;border:1px solid #75d8f755;background:#63dafa14;border-radius:9px;font-weight:1000;padding:7px 10px;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
  .question-team{font-size:14px;color:#fff;font-weight:900;margin-top:9px}

  .close-btn:hover{background:#ffffff27}
  .modal h2{font-size:clamp(23px,3.1vw,35px);margin:12px 0 17px;letter-spacing:-.035em;line-height:1.25}
  .answers{display:grid;gap:11px;margin:15px 0 14px}

  .question-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:19px;color:#aab6dc;font-size:12px}
  .hint-note{margin-top:12px;font-size:12px;color:#bac4e7}

  .feedback-icon{font-size:70px;display:inline-block;animation:pop .4s ease-out}
  @keyframes pop{0%{transform:scale(.3) rotate(-25deg)}70%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}
  .feedback-area h2{font-size:clamp(28px,4vw,44px);margin:6px 0 9px}
  .feedback-area p{margin:4px auto 12px;max-width:580px;color:#dae1ff;line-height:1.5}

  .result-label{font-size:16px;font-weight:1000;color:#fff}

<main id="app" class="app-container" aria-live="polite"></main>
<script>
"use strict";

/* Unit 3 – Music, Reading (Global Success 10), pp. 31–32.
   Questions 1–9: 4 vocabulary items from Task 2 and 5 original MCQs from Task 3.
   Questions 10–12: three easy additional MCQs taken from the provided reading. */
const QUESTION_BANK = [
  {id:"V1",kind:"TASK 2 · VOCABULARY",prompt:'What does the word “series” mean?',options:['A set of TV or radio programmes on the same subject','A single live music concert','A group of competition judges'],correct:0,evidence:'A series is a set of related TV or radio programmes.'},
  {id:"V2",kind:"TASK 2 · VOCABULARY",prompt:'What does “identify with” mean?',options:['To vote for a favourite singer','To feel similar to and understand someone','To remove a competitor from a contest'],correct:1,evidence:'The audience can identify with ordinary participants because they feel similar to them.'},
  {id:"V3",kind:"TASK 2 · VOCABULARY",prompt:'What does “in search of” mean?',options:['Waiting for','Celebrating','Looking for'],correct:2,evidence:'The judges travel around America looking for the best singers.'},
  {id:"V4",kind:"TASK 2 · VOCABULARY",prompt:'What does “eliminated” mean?',options:['Removed from the competition','Selected for the next round','Given the highest score'],correct:0,evidence:'The singer with the lowest number of votes is eliminated.'},
  {id:"R1",kind:"TASK 3 · READING",prompt:'What is American Idol?',options:['A game show on TV.','A TV singing competition.','A live dancing competition.'],correct:1,evidence:'Participants compete as singers and perform live on TV.'},
  {id:"R2",kind:"TASK 3 · READING",prompt:'Which of the following statements is correct?',options:['From the semi-final, singers who can go to the next stage are decided by the audience vote.','The judges choose as many singers as they can.','People around the world can vote for the songs they like.'],correct:0,evidence:'From the semi-final onwards, eligible viewers vote for their preferred singers.'},
  {id:"R3",kind:"TASK 3 · READING",prompt:'Who wins American Idol?',options:['The singer with the highest number of votes on the final night.','The singer with the highest number of votes and highest score from the judges.','The singer with the highest score from the judges.'],correct:0,evidence:'The most popular singer becomes the winner on the final night.'},
  {id:"R4",kind:"TASK 3 · READING",prompt:'Which of the following statements about the judges is NOT mentioned?',options:['They give comments after each live performance.','They have different views about the singers’ performances.','They are not in favour of choosing ordinary people.'],correct:2,evidence:'The text mentions judges’ opinions and comments, but does not say they oppose ordinary participants.'},
  {id:"R5",kind:"TASK 3 · READING",prompt:'What can be inferred about the competition in Viet Nam?',options:['The audience decides who makes it to the final stage.','All the singers will be famous.','It can help develop participants’ singing careers.'],correct:2,evidence:'Winners of different Vietnam Idol seasons have become famous singers.'},
  {id:"E1",kind:"BONUS · EASY",prompt:'When was American Idol first shown on television?',options:['January 2002','January 2007','January 2012'],correct:0,evidence:'American Idol was first shown on television in January 2002.'},
  {id:"E2",kind:"BONUS · EASY",prompt:'Where do the judges bring the best singers?',options:['To New York','To Hollywood','To the Virgin Islands'],correct:1,evidence:'The judges travel around America and bring the best singers to Hollywood.'},
  {id:"E3",kind:"BONUS · EASY",prompt:'How many stages did the first season of Vietnam Idol include?',options:['Two stages','Four stages','Three stages'],correct:2,evidence:'It included short performances, semi-finals and finals.'}
];
const PRIZE_POOL=[10,20,30,40,50,70,20,40,-10,-20,-30,-40];
const TEAM_PRESETS=[
  {name:'Rock Stars',emoji:'🎸',color:'#ff91b4'},
  {name:'Pop Idols',emoji:'🎤',color:'#ffd583'},
  {name:'Beat Makers',emoji:'🎧',color:'#79dff8'},
  {name:'Rhythm Rebels',emoji:'🥁',color:'#aeacff'},
  {name:'Melody Makers',emoji:'🎹',color:'#8af5c0'},
  {name:'Jazz Cats',emoji:'🎷',color:'#ffb78c'}
];
const BOX_COLORS=['#ff89b5','#91a9ff','#f6d56d','#75dfee','#bd94ff','#ffb57b','#7aefba','#ff99cf','#f8da87','#7ecbeb','#d6a3ff','#fba77f'];
const BOX_NOTES=['♫','♬','🎵','✦','♪','♩','🎶','✧','♪','♬','♫','✦'];
const state={screen:'setup',teamCount:4,setupNames:TEAM_PRESETS.map(t=>t.name),teams:[],boxes:[],activeTeam:0,openIndex:null,phase:'question',selected:null,readingOpen:false,soundOn:true,history:[],recipient:null};
const app=document.getElementById('app');
const safe=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>(n>0?'+':'')+n;
function randomize(array){const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toolbar(game){return `<div class="toolbar">
  ${game?'<button class="mini-btn" data-action="reading" title="Show the reading passage">📖 Reading Text</button>':''}
  <button class="mini-btn ${state.soundOn?'selected':''}" data-action="sound" title="Toggle sound">${state.soundOn?'🔊 Sound On':'🔇 Sound Off'}</button>
  <button class="mini-btn" data-action="fullscreen" title="Fullscreen (F)">⛶ Fullscreen</button>
</div>`;}
function tophead(game){return `<header class="tophead"><div class="brand"><div class="brand-icon" aria-hidden="true">🎁</div><div><div class="eyebrow">UNIT 3 · MUSIC · READING</div><h1>MUSIC <span>MYSTERY BOX</span></h1></div></div>${toolbar(game)}</header><div class="hero-line"></div>`;}
function renderSetup(){const countButtons=[2,3,4,5,6].map(n=>`<button type="button" class="count-btn ${state.teamCount===n?'active':''}" data-action="team-count" data-count="${n}" aria-pressed="${state.teamCount===n}">${n}</button>`).join('');
const inputs=TEAM_PRESETS.slice(0,state.teamCount).map((team,i)=>`<label class="name-input"><span class="avatar">${team.emoji}</span><input data-setup-name="${i}" aria-label="Team ${i+1} name" maxlength="30" value="${safe(state.setupNames[i])}" spellcheck="false"></label>`).join('');
return `${tophead(false)}<div class="setup-shell"><section class="setup-card"><div class="eyebrow">🎙️ WELCOME TO THE SHOW!</div><h2>Pick a box.<br><span class="gradient-text">Take the mystery!</span></h2><p class="lead">Read, answer, and choose your team's fate. Behind every box is a surprise — some rewards are big, and some points are negative!</p><div class="section-title">01 / How many teams?</div><div class="count-buttons" role="group" aria-label="Number of teams">${countButtons}</div><div class="section-title">02 / Your music teams (editable)</div><div class="name-grid">${inputs}</div><button type="button" class="primary-btn" data-action="start">🎬 START THE SHOW <span aria-hidden="true">→</span></button><p class="warning-text">12 mystery boxes · 12 multiple-choice questions · Play offline · No sign-in needed</p></section><aside class="preview-card"><div class="stage-light" aria-hidden="true">🎁🎶</div><h3>KEEP it or GIVE it?</h3><p><strong>Answer correctly</strong> to earn the right to choose KEEP or GIVE. Choose <strong>before</strong> discovering the secret points!</p><div class="prize-pills"><span class="prize-pill">+10</span><span class="prize-pill">+20</span><span class="prize-pill">+30</span><span class="prize-pill">+40</span><span class="prize-pill">+50</span><span class="prize-pill">+70</span><span class="prize-pill neg">−10</span><span class="prize-pill neg">−20</span><span class="prize-pill neg">−30</span><span class="prize-pill neg">−40</span></div><p class="small-note">Some values appear twice. All 12 rewards are shuffled every new game.</p><div class="steps"><div class="step">1. PICK 🎁</div><div class="step">2. ANSWER 🎤</div><div class="step">3. KEEP / GIVE 🎲</div></div></aside></div><div class="footer-note">Teacher-led classroom game · Based on <b>American Idol</b> (Global Success 10, pp. 31–32)</div>`;}
function renderBox(box,i){if(box.used){const correct=box.outcome==='correct';return `<button type="button" class="mystery-box used" disabled style="--box-color:${BOX_COLORS[i]}" title="Already opened"><span class="tile-id">BOX ${String(i+1).padStart(2,'0')}</span><span class="used-value ${!correct?'no-score':box.prize<0?'negative':''}">${correct?fmt(box.prize):'✕'}</span><span class="used-caption">${correct?safe(state.teams[box.awardTo].name):'NO POINTS'}</span></button>`;}
return `<button type="button" class="mystery-box" data-action="open-box" data-index="${i}" style="--box-color:${BOX_COLORS[i]}" aria-label="Open mystery box ${i+1}"><span class="music-spark" aria-hidden="true">${BOX_NOTES[i]}</span><span class="tile-id">BOX ${String(i+1).padStart(2,'0')}</span><span class="gift" aria-hidden="true"><span class="gift-bow"></span><span class="gift-lid"></span><span class="gift-base"></span></span><span class="tile-caption">MYSTERY ?</span></button>`;}
function renderTeam(team,i){return `<article class="score-item ${state.activeTeam===i?'active':''}" style="--team-color:${team.color}"><button type="button" class="team-select" data-action="active-team" data-index="${i}" title="Make this team the active team"><span class="team-emoji" aria-hidden="true">${team.emoji}</span><span class="team-name">${safe(team.name)}</span></button><span class="score-num">${team.score}</span><div class="score-ctrl"><button class="tiny-btn" data-action="adjust" data-index="${i}" data-delta="-5" title="Subtract 5 points from ${safe(team.name)}">−5</button><button class="tiny-btn" data-action="adjust" data-index="${i}" data-delta="5" title="Add 5 points to ${safe(team.name)}">+5</button></div></article>`;}
function renderGame(){const completed=state.boxes.filter(b=>b.used).length;const allDone=completed===12;const names=state.teams.map((t,i)=>({name:t.name,score:t.score,i}));const bestScore=Math.max(...names.map(t=>t.score));const winners=names.filter(t=>t.score===bestScore);const winnerNames=winners.map(w=>safe(w.name)).join(' & ');
return `${tophead(true)}<div class="game-layout"><section class="board-panel"><div class="board-head"><div><div class="eyebrow">🎼 THE MYSTERY STAGE</div><h2>Choose your lucky box!</h2></div><span class="progress-pill">${completed} / 12 boxes opened</span></div><div class="boxes-grid">${state.boxes.map((b,i)=>renderBox(b,i)).join('')}</div><div class="helper-strip"><span class="dot"></span>Click a team on the scoreboard to choose whose turn it is. <strong>Correct answer → KEEP or GIVE → secret points!</strong></div>${allDone?`<div class="win-banner"><div class="crown">🏆</div><h3>${winners.length>1?'IT’S A TIE!':'WE HAVE A WINNER!'}</h3><p>${winnerNames} · ${bestScore} points</p></div>`:''}</section><aside class="score-panel"><div class="eyebrow">🎧 LIVE SCOREBOARD</div><h2>Battle of the Bands</h2><p class="score-caption">Tap a team name to select its turn. Teacher can manually adjust scores by ±5.</p><div class="turn-banner"><small>${allDone?'Show complete':'Now playing'}</small><strong>${allDone?'✨ All boxes opened!':state.teams[state.activeTeam].emoji+' '+safe(state.teams[state.activeTeam].name)}</strong></div><div class="score-list">${state.teams.map((t,i)=>renderTeam(t,i)).join('')}</div><div class="score-footer"><button class="mini-btn" data-action="undo" ${state.history.length?'':'disabled'} title="Undo the most recent score action">↶ Undo</button><button class="mini-btn" data-action="new-game" title="Return to setup">⟳ New Game</button></div><p class="score-footnote">Secret prize pool: +10, +20, +20, +30, +40, +40, +50, +70, −10, −20, −30, −40. Each appears in one box. Incorrect answers earn 0.</p></aside></div><div class="footer-note">📖 Need the article? Use <b>Reading Text</b> at the top. Press <b>F</b> for fullscreen.</div>${state.openIndex!==null?renderModal():''}${state.readingOpen?renderReading():''}`;}
function answerKey(q){return `<div class="answer-key"><div>✅ Correct answer: <strong>${'ABC'[q.correct]}. ${safe(q.options[q.correct])}</strong></div><em>📖 Evidence: ${safe(q.evidence)}</em></div>`;}
function renderModal(){const box=state.boxes[state.openIndex];const q=box.question;const team=state.teams[state.activeTeam];let inner='';
const modalHead=`<div class="modal-header"><div><div class="question-pill">🎤 BOX ${String(state.openIndex+1).padStart(2,'0')} · ${safe(q.kind)}</div><div class="question-team">${team.emoji} Playing: ${safe(team.name)}</div></div>${box.used?'':`<button type="button" class="close-btn" data-action="cancel-box" aria-label="Cancel box" title="Cancel and return to the board">×</button>`}</div>`;
if(state.phase==='question'){
  inner=`${modalHead}<h2>${safe(q.prompt)}</h2><div class="answers">${q.options.map((opt,i)=>`<button type="button" class="answer-btn" data-action="answer" data-index="${i}"><span class="answer-letter">${'ABC'[i]}</span><span>${safe(opt)}</span></button>`).join('')}</div><div class="question-bottom"><span>💡 Teacher: click the answer your team gives.</span><button class="mini-btn" data-action="reading">📖 Read the passage</button></div><p class="hint-note">Tip: You may press 1, 2 or 3 to select an answer.</p>`;
}else if(state.phase==='wrong'){
  inner=`${modalHead}<div class="feedback-area"><div class="feedback-icon">🫢</div><h2 style="color:#ffaabe">NOT QUITE!</h2><p>No mystery points this round. Try again with the next box!</p></div>${answerKey(q)}<div class="modal-actions"><button type="button" class="action-btn secondary" data-action="retry">↶ Change answer</button><button type="button" class="action-btn danger" data-action="finish-wrong">Close Box · 0 Points →</button></div>`;
}else if(state.phase==='decision'){
  inner=`${modalHead}<div class="feedback-area"><div class="feedback-icon">🌟</div><h2 style="color:#a9fbd0">CORRECT ANSWER!</h2><p><b>${safe(team.name)}</b>, you've earned a mystery reward! Choose what to do with it <strong>before</strong> the secret points are revealed.</p></div>${answerKey(q)}<div class="modal-actions"><button type="button" class="action-btn keep" data-action="keep">🎁 KEEP IT<br><small>For your team</small></button><button type="button" class="action-btn give" data-action="give">💌 GIVE IT<br><small>To another team</small></button></div><p class="warning-text" style="text-align:center">⚠️ The surprise may add points OR take points away.</p>`;
}else if(state.phase==='give'){
  inner=`${modalHead}<div class="feedback-area"><div class="feedback-icon">💌</div><h2>WHO GETS THE BOX?</h2><p>Choose a different team to receive the secret points. The prize is still hidden!</p></div><div class="recipient-grid">${state.teams.map((t,i)=>i===state.activeTeam?'':`<button class="recipient" data-action="recipient" data-index="${i}"><span>${t.emoji}</span>${safe(t.name)}</button>`).join('')}</div><div class="modal-actions"><button type="button" class="action-btn secondary" data-action="back-to-decision">↶ Back to KEEP / GIVE</button></div>`;
}else if(state.phase==='reveal'){
  const target=state.teams[box.awardTo];const value=box.prize;const given=box.awardTo!==box.player;
  inner=`<div class="feedback-area"><div class="feedback-icon">${value>=0?'🎉':'😱'}</div><h2>${value>=0?'MYSTERY REVEALED!':'OH NO! A TWIST!'}</h2><p>The secret reward was hidden until the team made its choice.</p><div class="result-card ${value<0?'negative':''}"><div class="result-kicker">${given?'GIVEN TO':'KEPT BY'} ${safe(target.name)}</div><div class="result-points">${fmt(value)}</div><div class="result-label">${value>=0?'POINTS! 🌟':'POINTS! ⚡'}</div></div><p><b>${target.emoji} ${safe(target.name)}</b> ${value>=0?'gains':'loses'} <b>${Math.abs(value)}</b> points.${given?` Gift from ${safe(state.teams[box.player].name)}.`:''}</p></div><div class="modal-actions"><button class="action-btn primary" data-action="next-turn">🎵 NEXT BOX →</button></div>`;
}
return `<div class="backdrop" id="question-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="Mystery Box Question">${inner}</section></div>`;}
function renderReading(){return `<div class="reading-backdrop"><section class="reading-card" role="dialog" aria-modal="true" aria-label="American Idol reading passage"><div class="reading-head"><div><div class="eyebrow" style="color:#9175b8">UNIT 3 · MUSIC · READING</div><h2>📖 American Idol</h2></div><button class="close-btn" data-action="close-reading" aria-label="Close reading">×</button></div><p><i>American Idol</i> was shown for the first time on television in January 2002. At that time, there were many movies and TV <mark>series</mark>, but no reality competitions on TV. The participants in this programme are ordinary people who the audience can really <mark>identify with</mark>.</p><p>First, judges travel all round America <mark>in search of</mark> the best singers and bring them to Hollywood. Twenty-four to thirty-six participants are then chosen to go on to the next stages where they perform live on TV, and receive the judges’ opinions. From the semi-final onwards, people over 13 and living in the US, Puerto Rico or the Virgin Islands can vote for their preferred singers online or through text messaging. The singer with the lowest number of votes is <mark>eliminated</mark>. On the final night, the most popular singer becomes the winner of that <i>American Idol</i> season.</p><p>People watch <i>American Idol</i> not only to see the participants sing, but also to hear the comments of the judges, who play an important role in the competition. Their different opinions and interesting arguments make the show very exciting.</p><p>The first season of <i>Vietnam Idol</i> was shown in 2007. It included three stages: short performances to choose participants, semi-finals and finals. The winners of the show’s different seasons have become famous singers in Viet Nam.</p><div style="text-align:right"><button type="button" class="mini-btn" style="background:#e9e1ff;color:#453263;border-color:#d9cef2" data-action="close-reading">Back to game →</button></div></section></div>`;}
function render(){app.innerHTML=state.screen==='setup'?renderSetup():renderGame();}
function sound(kind){if(!state.soundOn)return;try{const AudioContext=window.AudioContext||window.webkitAudioContext; if(!AudioContext)return; const ctx=new AudioContext();const now=ctx.currentTime;const tones=kind==='win'?[523,659,784]:kind==='loss'?[392,310]:kind==='open'?[440,554]:kind==='big'?[523,659,784,1046]:[600];tones.forEach((hz,i)=>{const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(hz,now+i*.11);g.gain.setValueAtTime(.0001,now+i*.11);g.gain.exponentialRampToValueAtTime(.055,now+i*.11+.017);g.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.18);o.connect(g).connect(ctx.destination);o.start(now+i*.11);o.stop(now+i*.11+.2)});setTimeout(()=>ctx.close().catch(()=>{}),1000);}catch(e){/* sound is optional */}}
function snapshot(){state.history.push({teams:state.teams.map(t=>({...t})),boxes:state.boxes.map(b=>({...b})),activeTeam:state.activeTeam});if(state.history.length>30)state.history.shift();}
function start(){state.teams=TEAM_PRESETS.slice(0,state.teamCount).map((t,i)=>({...t,name:state.setupNames[i].trim()||t.name,score:0}));const questions=randomize(QUESTION_BANK),prizes=randomize(PRIZE_POOL);state.boxes=questions.map((question,i)=>({question,prize:prizes[i],used:false,outcome:null,player:null,awardTo:null}));state.openIndex=null;state.activeTeam=0;state.history=[];state.screen='game';state.phase='question';state.readingOpen=false;sound('win');render();}
function openBox(index){if(state.boxes[index]?.used)return;state.openIndex=index;state.phase='question';state.selected=null;state.readingOpen=false;sound('open');render();}
function answer(index){if(state.phase!=='question'||state.openIndex===null)return;const q=state.boxes[state.openIndex].question;state.selected=index;state.phase=index===q.correct?'decision':'wrong';sound(index===q.correct?'win':'loss');render();}
function award(recipient){if(state.openIndex===null)return;const box=state.boxes[state.openIndex];if(box.used)return;snapshot();box.used=true;box.outcome='correct';box.player=state.activeTeam;box.awardTo=recipient;state.teams[recipient].score+=box.prize;state.phase='reveal';sound(box.prize>=50?'big':box.prize>=0?'win':'loss');render();}
function finishWrong(){if(state.openIndex===null)return;const box=state.boxes[state.openIndex];if(box.used)return;snapshot();box.used=true;box.outcome='wrong';box.player=state.activeTeam;state.openIndex=null;state.phase='question';state.activeTeam=(state.activeTeam+1)%state.teams.length;render();}
function nextTurn(){state.openIndex=null;state.phase='question';state.activeTeam=(state.activeTeam+1)%state.teams.length;render();}
function undo(){if(!state.history.length)return;const prev=state.history.pop();state.teams=prev.teams;state.boxes=prev.boxes;state.activeTeam=prev.activeTeam;state.openIndex=null;state.phase='question';render();}
function newGame(){if(window.confirm('Start a new game? Current scores and opened boxes will be reset.')){state.setupNames=state.teams.map(t=>t.name).concat(state.setupNames.slice(state.teams.length));state.teamCount=state.teams.length;state.screen='setup';state.openIndex=null;state.readingOpen=false;render();}}
function adjustScore(index,delta){snapshot();state.teams[index].score+=delta;sound(delta>0?'win':'loss');render();}
function handleAction(button){const action=button.dataset.action;const index=Number(button.dataset.index);switch(action){
case 'team-count':state.teamCount=Number(button.dataset.count);render();break;
case 'start':start();break;
case 'sound':state.soundOn=!state.soundOn;render();break;
case 'fullscreen':if(document.fullscreenElement){document.exitFullscreen?.();}else{document.documentElement.requestFullscreen?.().catch(()=>{});}break;
case 'reading':state.readingOpen=true;render();break;
case 'close-reading':state.readingOpen=false;render();break;
case 'open-box':openBox(index);break;
case 'answer':answer(index);break;
case 'cancel-box':if(state.phase!=='reveal'){state.openIndex=null;state.phase='question';render();}break;
case 'retry':state.phase='question';state.selected=null;render();break;
case 'finish-wrong':finishWrong();break;
case 'keep':award(state.activeTeam);break;
case 'give':state.phase='give';render();break;
case 'recipient':if(index!==state.activeTeam)award(index);break;
case 'back-to-decision':state.phase='decision';render();break;
case 'next-turn':nextTurn();break;
case 'active-team':if(state.openIndex===null){state.activeTeam=index;render();}break;
case 'adjust':if(state.openIndex===null)adjustScore(index,Number(button.dataset.delta));break;
case 'undo':if(state.openIndex===null)undo();break;
case 'new-game':if(state.openIndex===null)newGame();break;
}}
document.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(button&&!button.disabled){handleAction(button);}});
document.addEventListener('input',e=>{if(e.target.matches('[data-setup-name]')){state.setupNames[Number(e.target.dataset.setupName)]=e.target.value;}});
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{});}if(e.key==='Escape'&&state.readingOpen){state.readingOpen=false;render();}else if(e.key==='Escape'&&state.openIndex!==null&&state.phase!=='reveal'){state.openIndex=null;state.phase='question';render();}else if(state.screen==='game'&&state.openIndex!==null&&state.phase==='question'&&!state.readingOpen&&['1','2','3'].includes(e.key)){answer(Number(e.key)-1);}});
render();
</script>
