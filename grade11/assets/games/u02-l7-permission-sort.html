<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Permission Phrase Sort – 3 Teams</title>
<style>
:root{
  --bg:#fffaf3; --ink:#17324d; --muted:#64748b; --card:#ffffff;
  --ask:#dff4ff; --give:#e8f8e8; --refuse:#ffe8ec;
  --shadow:0 12px 30px rgba(23,50,77,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff7ed,#eff6ff);color:var(--ink)}
header{padding:18px 24px 10px;text-align:center}
h1{margin:0;font-size:clamp(28px,4vw,52px)}
.subtitle{font-size:clamp(15px,1.6vw,21px);color:var(--muted);margin-top:6px}
.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1050px;margin:12px auto}
.team{background:white;border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);font-weight:800;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.team.active{outline:4px solid #f59e0b;transform:translateY(-2px)}
main{max-width:1250px;margin:auto;padding:8px 18px 28px}
.turn{text-align:center;font-size:22px;font-weight:800;margin:8px}
.phrase-zone{background:rgba(255,255,255,.72);border-radius:22px;padding:15px;box-shadow:var(--shadow)}
.phrases{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:112px}
.phrase{background:white;border:2px solid #cbd5e1;border-radius:14px;padding:12px 15px;font-size:18px;font-weight:700;cursor:grab;box-shadow:0 5px 12px rgba(0,0,0,.07);user-select:none}
.phrase:hover{transform:translateY(-2px)}
.phrase.selected{outline:4px solid #f59e0b}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.cat{min-height:280px;border-radius:22px;padding:14px;border:3px dashed rgba(23,50,77,.25)}
.cat h2{text-align:center;margin:3px 0 12px;font-size:24px}
.cat.ask{background:var(--ask)} .cat.give{background:var(--give)} .cat.refuse{background:var(--refuse)}
.drop{min-height:210px;display:flex;flex-direction:column;gap:8px}
.placed{background:white;border-radius:12px;padding:10px 12px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.06)}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
button{border:0;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:800;cursor:pointer;background:#17324d;color:white}
button.secondary{background:#64748b}
button.check{background:#0f766e}
#message{text-align:center;min-height:36px;font-size:22px;font-weight:900;margin-top:10px}
.correct{color:#15803d}.wrong{color:#b91c1c}
.small{text-align:center;color:var(--muted);margin-top:8px;font-size:14px}
@media(max-width:850px){.categories{grid-template-columns:1fr}.cat{min-height:180px}.drop{min-height:110px}}
</style>
</head>
<body>
<header>
  <h1>🎯 Permission Phrase Sort</h1>
  <div class="subtitle">Unit 2 • Communication • Asking for & Giving Permission</div>
</header>
<main>
  <div class="scorebar">
    <div class="team active" id="team0"><span>🔵 Team 1</span><span id="score0">0</span></div>
    <div class="team" id="team1"><span>🟢 Team 2</span><span id="score1">0</span></div>
    <div class="team" id="team2"><span>🟣 Team 3</span><span id="score2">0</span></div>
  </div>
  <div class="turn" id="turn">Team 1's turn</div>

  <section class="phrase-zone">
    <div class="phrases" id="phrases"></div>
    <div class="small">Drag a phrase into a category — or click a phrase, then click a category.</div>
  </section>

  <section class="categories">
    <div class="cat ask" data-cat="ask"><h2>🙋 Asking for permission</h2><div class="drop" id="ask"></div></div>
    <div class="cat give" data-cat="give"><h2>✅ Giving permission</h2><div class="drop" id="give"></div></div>
    <div class="cat refuse" data-cat="refuse"><h2>🚫 Refusing permission</h2><div class="drop" id="refuse"></div></div>
  </section>

  <div id="message"></div>
  <div class="controls">
    <button class="check" onclick="checkAll()">Check Answers</button>
    <button class="secondary" onclick="resetGame()">Reset / Play Again</button>
  </div>
</main>

<script>
const data=[
["Can I ...?","ask"],["Do you mind if I ...?","ask"],["Would you mind if I ...?","ask"],["Is it OK if I ...?","ask"],
["Sure.","give"],["Certainly.","give"],["Of course you can.","give"],["No problem.","give"],["Please feel free to ...","give"],
["I'm afraid not.","refuse"],["I'm afraid you can't.","refuse"],["No, please don't.","refuse"],["I'm sorry, but that's not possible.","refuse"]
];
let currentTeam=0, scores=[0,0,0], selected=null, locked=false;

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makePhrase(text,cat){
 const el=document.createElement("div"); el.className="phrase"; el.textContent=text;
 el.draggable=true; el.dataset.answer=cat;
 el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",text));
 el.addEventListener("click",()=>{document.querySelectorAll(".phrase").forEach(x=>x.classList.remove("selected")); selected=el; el.classList.add("selected")});
 return el;
}
function render(){
 const box=document.getElementById("phrases"); box.innerHTML="";
 shuffle(data).forEach(([t,c])=>box.appendChild(makePhrase(t,c)));
 ["ask","give","refuse"].forEach(id=>document.getElementById(id).innerHTML="");
}
document.querySelectorAll(".cat").forEach(cat=>{
 cat.addEventListener("dragover",e=>e.preventDefault());
 cat.addEventListener("drop",e=>{
   e.preventDefault(); if(locked)return;
   const text=e.dataTransfer.getData("text/plain");
   const el=[...document.querySelectorAll(".phrase")].find(x=>x.textContent===text);
   if(el) place(el,cat.dataset.cat);
 });
 cat.addEventListener("click",e=>{
   if(selected && !locked && !e.target.classList.contains("phrase")) place(selected,cat.dataset.cat);
 });
});
function place(el,cat){
 const correct=el.dataset.answer===cat;
 const msg=document.getElementById("message");
 if(correct){
   scores[currentTeam]+=10; document.getElementById("score"+currentTeam).textContent=scores[currentTeam];
   const p=document.createElement("div"); p.className="placed"; p.textContent="✓ "+el.textContent;
   document.getElementById(cat).appendChild(p); el.remove();
   msg.className="correct"; msg.textContent="Correct! +10 points 🎉";
 }else{
   msg.className="wrong"; msg.textContent="Not quite — another team gets the next turn!";
 }
 selected=null;
 nextTeam();
 if(document.querySelectorAll(".phrase").length===0) finish();
}
function nextTeam(){
 document.getElementById("team"+currentTeam).classList.remove("active");
 currentTeam=(currentTeam+1)%3;
 document.getElementById("team"+currentTeam).classList.add("active");
 document.getElementById("turn").textContent=`Team ${currentTeam+1}'s turn`;
}
function checkAll(){
 const remaining=document.querySelectorAll(".phrase").length;
 const msg=document.getElementById("message");
 if(remaining){msg.className="wrong";msg.textContent=`${remaining} phrase(s) still need sorting.`}
 else finish();
}
function finish(){
 locked=true;
 const max=Math.max(...scores), winners=scores.map((s,i)=>s===max?i+1:null).filter(Boolean);
 const msg=document.getElementById("message"); msg.className="correct";
 msg.textContent=`🏆 ${winners.length>1?"Teams "+winners.join(" & "):"Team "+winners[0]} win${winners.length>1?"":"s"} with ${max} points!`;
}
function resetGame(){
 currentTeam=0;scores=[0,0,0];locked=false;selected=null;
 scores.forEach((s,i)=>{document.getElementById("score"+i).textContent=0;document.getElementById("team"+i).classList.toggle("active",i===0)});
 document.getElementById("turn").textContent="Team 1's turn";
 document.getElementById("message").textContent="";
 render();
}
render();
</script>
</body>
</html>
