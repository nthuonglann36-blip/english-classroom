 let osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=kind==="wrong"||kind==="lose"?"triangle":"sine";osc.frequency.value=freq;osc.connect(gain);gain.connect(audioContext.destination);
 let at=audioContext.currentTime+offset;gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.105,at+.015);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);osc.start(at);osc.stop(at+duration+.015);offset+=duration*.82;
 }}catch(e){/* Audio is optional; the game works with sound blocked. */}}
