'use strict';
const FLAGS=JSON.parse(document.getElementById('flag-data').textContent),$=id=>document.getElementById(id);let order=[...FLAGS],index=0,shown=false;
function render(){const flag=order[index];$('progress').textContent='Flag '+(index+1)+' / '+order.length+' · READY • THINK • GUESS';$('flag').innerHTML=flag.svg;$('answer').textContent='';$('show').disabled=false;$('next').disabled=true;$('next').textContent=index===order.length-1?'Finish →':'Next flag →';shown=false;}
function restart(){order=[...FLAGS];for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}index=0;$('game').hidden=false;$('complete').hidden=true;render()}
$('show').addEventListener('click',()=>{if(shown)return;shown=true;$('answer').textContent=order[index].name;$('show').disabled=true;$('next').disabled=false;});
$('next').addEventListener('click',()=>{if(!shown)return;if(index===order.length-1){$('game').hidden=true;$('complete').hidden=false;$('countries').textContent=order.map(f=>f.name).join(' · ');}else{index++;render()}});$('shuffle').addEventListener('click',restart);$('again').addEventListener('click',restart);
document.querySelector('[data-fullscreen]').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}});
document.addEventListener('keydown',event=>{if(event.ctrlKey||event.metaKey||event.altKey||event.target instanceof Element&&event.target.closest('input,textarea,select'))return;if(['ArrowLeft','ArrowRight','Escape'].includes(event.key)&&parent!==window){try{parent.document.body.dispatchEvent(new KeyboardEvent('keydown',{key:event.key,bubbles:true}))}catch{}}});render();
</script></body></html>
