<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generation Gap - Spin & True/False</title>
<style>
  :root{
    --bg1:#091540;
    --bg2:#101a5b;
    --panel:rgba(255,255,255,.10);
    --panel2:rgba(255,255,255,.15);
    --text:#ffffff;
    --muted:#d9e2ff;
    --accent:#ffe45e;
    --ok:#35e38a;
    --bad:#ff5c7c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
  body{
    min-height:100vh;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 10% 10%, rgba(89,255,220,.25), transparent 28%),
      radial-gradient(circle at 90% 10%, rgba(255,89,183,.20), transparent 30%),
      radial-gradient(circle at 50% 95%, rgba(255,226,82,.14), transparent 28%),
      linear-gradient(135deg,var(--bg1),var(--bg2));
  }
  .stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .star{
    position:absolute;width:5px;height:5px;border-radius:50%;
    background:white;opacity:.5;animation:twinkle 2.5s infinite ease-in-out
  }
  @keyframes twinkle{0%,100%{transform:scale(.6);opacity:.25}50%{transform:scale(1.7);opacity:.9}}
  .app{position:relative;z-index:1;max-width:1400px;margin:auto;padding:18px 18px 28px}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin-bottom:14px;padding:12px 16px;border:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.12);backdrop-filter:blur(10px);border-radius:22px
  }
  .title-wrap h1{margin:0;font-size:clamp(24px,3vw,44px);letter-spacing:.4px}
  .title-wrap p{margin:4px 0 0;color:var(--muted);font-weight:700}
  .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button{
    border:0;border-radius:14px;padding:12px 16px;font-weight:900;font-size:15px;
    cursor:pointer;transition:.18s transform,.18s opacity,.18s filter;
  }
  button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}
  button:active:not(:disabled){transform:translateY(0) scale(.98)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .small-btn{background:rgba(255,255,255,.13);color:white;border:1px solid rgba(255,255,255,.18)}
  .scoreboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  .team-card{
    position:relative;overflow:hidden;border-radius:18px;padding:12px 14px;
    background:var(--panel);border:2px solid transparent;box-shadow:0 10px 30px rgba(0,0,0,.17);
    transition:.25s transform,.25s border-color,.25s box-shadow
  }
  .team-card::before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(255,255,255,.16),transparent 55%);pointer-events:none}
  .team-card.active{
    border-color:var(--accent);transform:translateY(-4px) scale(1.02);
    box-shadow:0 0 0 4px rgba(255,228,94,.12),0 16px 38px rgba(0,0,0,.28)
  }
  .team-name{
    position:relative;font-size:18px;font-weight:950;outline:none;border-bottom:1px dashed rgba(255,255,255,.30);
    display:inline-block;min-width:82px
  }
  .score-row{position:relative;display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;gap:10px}
  .score{font-size:36px;font-weight:1000;line-height:1}
  .mini-controls{display:flex;gap:5px}
  .mini-controls button{padding:5px 8px;border-radius:8px;font-size:12px;background:rgba(255,255,255,.15);color:white}
  .main{
    display:grid;grid-template-columns:minmax(320px,.85fr) minmax(440px,1.25fr);gap:16px;align-items:stretch
  }
  .panel{
    background:var(--panel);border:1px solid rgba(255,255,255,.18);border-radius:26px;
    box-shadow:0 16px 50px rgba(0,0,0,.20);backdrop-filter:blur(12px)
  }
  .wheel-panel{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:550px}
  .wheel-title{font-weight:950;font-size:23px;margin-bottom:10px}
  .wheel-wrap{position:relative;width:min(72vw,390px);aspect-ratio:1;margin:8px auto 18px}
  .pointer{
    position:absolute;z-index:8;left:50%;top:-18px;transform:translateX(-50%);
    width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:0;border-bottom:36px solid var(--accent);
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))
  }
  .wheel{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(#ff5c7c 0 25%, #47c6ff 25% 50%, #45dd8e 50% 75%, #ffca52 75% 100%);
    border:12px solid rgba(255,255,255,.95);
    box-shadow:0 0 0 7px rgba(255,255,255,.16),0 20px 50px rgba(0,0,0,.35);
    transition:transform 4.2s cubic-bezier(.16,.73,.18,1);
    overflow:hidden
  }
  .wheel::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:68px;height:68px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 8px rgba(13,19,68,.30),0 6px 16px rgba(0,0,0,.3)
  }
  .wheel-label{
    position:absolute;z-index:2;transform:translate(-50%,-50%);
    width:120px;text-align:center;font-weight:1000;font-size:20px;
    text-shadow:0 2px 4px rgba(0,0,0,.38);pointer-events:none
  }
  .spin-btn{
    min-width:230px;font-size:20px;padding:15px 22px;color:#13204b;
    background:linear-gradient(135deg,#fff36c,#ffb44c);
    box-shadow:0 10px 28px rgba(255,209,79,.28)
  }
  .spin-btn.ready{animation:pulse 1.35s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,228,94,.30),0 10px 28px rgba(255,209,79,.24)}50%{box-shadow:0 0 0 14px rgba(255,228,94,0),0 15px 36px rgba(255,209,79,.38)}}
  .selected-team{margin-top:10px;min-height:24px;color:var(--muted);font-weight:850;text-align:center}
  .quiz-panel{padding:20px;display:flex;flex-direction:column;min-height:550px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .badge{
    display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;
    background:rgba(255,255,255,.13);font-weight:900;color:#fff
  }
  .progress{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.22)}
  .dot.done{background:var(--ok)}
  .dot.current{background:var(--accent);box-shadow:0 0 0 4px rgba(255,228,94,.16)}
  .question-area{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px 4px}
  .eyebrow{font-size:14px;letter-spacing:1.8px;text-transform:uppercase;color:#bfcaff;font-weight:950}
  .statement{
    margin:14px auto 20px;max-width:820px;font-size:clamp(27px,3.5vw,47px);
    line-height:1.15;font-weight:1000;text-wrap:balance
  }
  .answer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(650px,100%)}
  .answer{font-size:24px;padding:18px 18px;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.18)}
  .true-btn{background:linear-gradient(135deg,#20c874,#3ce8a0)}
  .false-btn{background:linear-gradient(135deg,#ff4d69,#ff7b66)}
  .feedback{
    margin-top:18px;min-height:76px;width:min(780px,100%);padding:14px 16px;border-radius:18px;
    background:rgba(255,255,255,.09);display:none
  }
  .feedback.show{display:block;animation:pop .28s ease-out}
  @keyframes pop{0%{transform:scale(.93);opacity:0}100%{transform:scale(1);opacity:1}}
  .feedback strong{font-size:22px}
  .feedback p{margin:6px 0 0;color:#eef1ff;font-weight:700;line-height:1.45}
  .next-btn{
    margin-top:14px;background:#fff;color:#10194d;align-self:center;min-width:220px;display:none
  }
  .next-btn.show{display:block}
  .placeholder{color:#ced7ff;font-size:22px;font-weight:800;max-width:680px;line-height:1.5}
  .shake{animation:shake .35s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-5px)}}
  .winner{
    font-size:clamp(34px,5vw,62px);font-weight:1000;line-height:1.1;margin:12px 0;
    background:linear-gradient(90deg,#fff36c,#70ffd6,#ff84d5,#fff36c);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 2s linear infinite
  }
  @keyframes shine{to{background-position:300% 0}}
  .confetti{position:fixed;width:10px;height:16px;z-index:9999;pointer-events:none;top:-20px;animation:fall linear forwards}
  @keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(920deg);opacity:.95}}
  .footer-note{text-align:center;color:#b9c5f6;font-weight:700;font-size:13px;margin-top:12px}
  .correct-flash{animation:greenFlash .5s ease}
  .wrong-flash{animation:redFlash .5s ease}
  @keyframes greenFlash{50%{box-shadow:0 0 0 6px rgba(53,227,138,.28),0 16px 60px rgba(53,227,138,.24)}}
  @keyframes redFlash{50%{box-shadow:0 0 0 6px rgba(255,92,124,.25),0 16px 60px rgba(255,92,124,.22)}}
  @media (max-width:960px){
    .main{grid-template-columns:1fr}.wheel-panel{min-height:auto}.quiz-panel{min-height:500px}
    .scoreboard{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:600px){
    .app{padding:10px}.scoreboard{gap:7px}.team-card{padding:10px}.score{font-size:28px}
    header{align-items:flex-start;flex-direction:column}.actions{width:100%;justify-content:flex-start}
    .answer-buttons{grid-template-columns:1fr}.wheel-wrap{width:min(82vw,340px)}
    .statement{font-size:29px}.quiz-panel{padding:15px}.wheel-panel{padding:16px}
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="app">
  <header>
    <div class="title-wrap">
      <h1>🎡 GENERATION GAP: SPIN & TRUE / FALSE</h1>
      <p>4 teams • 7 statements • +10 points for each correct answer</p>
    </div>
    <div class="actions">
      <button class="small-btn" id="soundBtn">🔊 Sound: ON</button>
      <button class="small-btn" id="fullscreenBtn">⛶ Full screen</button>
      <button class="small-btn" id="resetBtn">↻ Reset game</button>
    </div>
  </header>

  <section class="scoreboard" id="scoreboard"></section>

  <main class="main">
    <section class="panel wheel-panel">
      <div class="wheel-title">🎯 SPIN THE WHEEL</div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
      </div>
      <button class="spin-btn ready" id="spinBtn">SPIN!</button>
      <div class="selected-team" id="selectedTeam">Spin the wheel to choose a team.</div>
    </section>

    <section class="panel quiz-panel" id="quizPanel">
      <div class="topline">
        <div class="badge" id="roundBadge">✨ Ready!</div>
        <div class="progress" id="progress"></div>
      </div>

      <div class="question-area" id="questionArea">
        <div class="placeholder">
          👆 Spin the wheel. The chosen team answers one <b>True / False</b> statement.
        </div>
      </div>
      <button class="next-btn" id="nextBtn">🎡 Next round</button>
    </section>
  </main>

  <div class="footer-note">
    Tip: click a team name to rename it. Use ± to adjust scores.
  </div>
</div>

<script>
const teams = [
  {name:"TEAM 1", score:0, emoji:"🔥"},
  {name:"TEAM 2", score:0, emoji:"⚡"},
  {name:"TEAM 3", score:0, emoji:"🚀"},
  {name:"TEAM 4", score:0, emoji:"🌟"}
];

const questions = [
  {
    text:"Mark has some arguments over small things with his family members.",
    answer:true,
    explain:"Mark says his family understands each other quite well, though they still argue over small things."
  },
  {
    text:"Mai lives with grandparents who have traditional views.",
    answer:true,
    explain:"Mai lives with her extended family, and she says her grandparents hold traditional views."
  },
  {
    text:"Mark lives in a nuclear family.",
    answer:true,
    explain:"Mark lives in a nuclear family with his parents and brother."
  },
  {
    text:"Mai’s parents don’t force their children to follow in their footsteps.",
    answer:true,
    explain:"Mai says her parents give advice but never force the children to follow in their footsteps."
  },
  {
    text:"Mai’s grandfather wants her brother to become a musician.",
    answer:false,
    explain:"False. Her grandfather wants her brother to be an engineer, while her brother hopes to become a musician."
  },
  {
    text:"Mai’s grandmother thinks women have to do all the housework.",
    answer:true,
    explain:"Mai says her grandmother thinks women have to do all the housework."
  },
  {
    text:"Mark lives with his parents, brother, and grandparents.",
    answer:false,
    explain:"False. Mark says he lives with his parents and brother in a nuclear family."
  }
];

let soundOn = true;
let currentRotation = 0;
let spinning = false;
let activeTeam = null;
let currentQuestion = null;
let usedQuestions = [];
let answered = false;
let roundCount = 0;

const scoreboard = document.getElementById("scoreboard");
const wheel = document.getElementById("wheel");
const spinBtn = document.getElementById("spinBtn");
const selectedTeamEl = document.getElementById("selectedTeam");
const questionArea = document.getElementById("questionArea");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");
const roundBadge = document.getElementById("roundBadge");
const quizPanel = document.getElementById("quizPanel");

function renderTeams(){
  scoreboard.innerHTML = "";
  teams.forEach((t,i)=>{
    const card = document.createElement("div");
    card.className = "team-card" + (activeTeam===i ? " active":"");
    card.innerHTML = `
      <div class="team-name" contenteditable="true" spellcheck="false" data-i="${i}">${t.emoji} ${t.name}</div>
      <div class="score-row">
        <div class="score">${t.score}</div>
        <div class="mini-controls">
          <button data-act="minus" data-i="${i}">−10</button>
          <button data-act="plus" data-i="${i}">+10</button>
        </div>
      </div>`;
    scoreboard.appendChild(card);
  });

  document.querySelectorAll(".team-name").forEach(el=>{
    el.addEventListener("blur", e=>{
      const i = +e.currentTarget.dataset.i;
      const txt = e.currentTarget.textContent.trim().replace(teams[i].emoji,"").trim();
      teams[i].name = txt || `TEAM ${i+1}`;
      updateWheelLabels();
      renderTeams();
    });
    el.addEventListener("keydown", e=>{
      if(e.key==="Enter"){ e.preventDefault(); e.currentTarget.blur(); }
    });
  });

  scoreboard.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = +b.dataset.i;
      teams[i].score = Math.max(0, teams[i].score + (b.dataset.act==="plus" ? 10 : -10));
      renderTeams();
    });
  });
}

function updateWheelLabels(){
  wheel.querySelectorAll(".wheel-label").forEach(e=>e.remove());
  const angles = [45,135,225,315];
  teams.forEach((t,i)=>{
    const lab = document.createElement("div");
    lab.className = "wheel-label";
    const a = angles[i] * Math.PI / 180;
    const r = 36;
    const x = 50 + Math.sin(a)*r;
    const y = 50 - Math.cos(a)*r;
    lab.style.left = x + "%";
    lab.style.top = y + "%";
    lab.textContent = t.name;
    wheel.appendChild(lab);
  });
}

function renderProgress(){
  progress.innerHTML = "";
  questions.forEach((_,i)=>{
    const d = document.createElement("span");
    d.className = "dot";
    if(i < roundCount) d.classList.add("done");
    if(i === roundCount && roundCount < questions.length) d.classList.add("current");
    progress.appendChild(d);
  });
}

function tone(freq=520, duration=.12, type="sine", volume=.05){
  if(!soundOn) return;
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  }catch(e){}
}
function correctSound(){ tone(660,.12,"sine",.07); setTimeout(()=>tone(880,.18,"sine",.06),110); }
function wrongSound(){ tone(190,.18,"sawtooth",.05); setTimeout(()=>tone(150,.22,"sawtooth",.045),120); }
function spinSound(){ tone(420,.07,"square",.025); }

function pickQuestion(){
  if(usedQuestions.length === questions.length) return null;
  let available = questions.map((_,i)=>i).filter(i=>!usedQuestions.includes(i));
  const idx = available[Math.floor(Math.random()*available.length)];
  usedQuestions.push(idx);
  return questions[idx];
}

function showQuestion(){
  currentQuestion = pickQuestion();
  answered = false;
  if(!currentQuestion){ endGame(); return; }
  roundBadge.textContent = `🎤 ${teams[activeTeam].name} • Statement ${roundCount+1}/${questions.length}`;
  questionArea.innerHTML = `
    <div class="eyebrow">TRUE OR FALSE?</div>
    <div class="statement">${currentQuestion.text}</div>
    <div class="answer-buttons">
      <button class="answer true-btn" id="trueBtn">✅ TRUE</button>
      <button class="answer false-btn" id="falseBtn">❌ FALSE</button>
    </div>
    <div class="feedback" id="feedback"></div>
  `;
  document.getElementById("trueBtn").addEventListener("click",()=>answer(true));
  document.getElementById("falseBtn").addEventListener("click",()=>answer(false));
  nextBtn.classList.remove("show");
  renderProgress();
}

function answer(choice){
  if(answered) return;
  answered = true;
  const ok = choice === currentQuestion.answer;
  const fb = document.getElementById("feedback");
  document.querySelectorAll(".answer").forEach(b=>b.disabled=true);

  if(ok){
    teams[activeTeam].score += 10;
    fb.innerHTML = `<strong>🎉 CORRECT! +10 points</strong><p>${currentQuestion.explain}</p>`;
    fb.style.border = "1px solid rgba(53,227,138,.55)";
    quizPanel.classList.remove("wrong-flash");
    void quizPanel.offsetWidth;
    quizPanel.classList.add("correct-flash");
    correctSound();
    confetti(70);
  } else {
    fb.innerHTML = `<strong>😮 OOPS! The correct answer is ${currentQuestion.answer ? "TRUE" : "FALSE"}.</strong><p>${currentQuestion.explain}</p>`;
    fb.style.border = "1px solid rgba(255,92,124,.55)";
    quizPanel.classList.remove("correct-flash");
    void quizPanel.offsetWidth;
    quizPanel.classList.add("wrong-flash","shake");
    setTimeout(()=>quizPanel.classList.remove("shake"),400);
    wrongSound();
  }
  fb.classList.add("show");
  renderTeams();
  roundCount++;
  renderProgress();

  if(roundCount >= questions.length){
    nextBtn.textContent = "🏆 See the results";
  } else {
    nextBtn.textContent = "🎡 Next round";
  }
  nextBtn.classList.add("show");
}

nextBtn.addEventListener("click", ()=>{
  if(roundCount >= questions.length){ endGame(); return; }
  activeTeam = null;
  currentQuestion = null;
  answered = false;
  renderTeams();
  roundBadge.textContent = "✨ Ready!";
  selectedTeamEl.textContent = "Spin the wheel to choose a team.";
  questionArea.innerHTML = `<div class="placeholder">🎡 New round! Spin to choose the next team.</div>`;
  nextBtn.classList.remove("show");
  spinBtn.disabled = false;
  spinBtn.classList.add("ready");
});

spinBtn.addEventListener("click", ()=>{
  if(spinning || currentQuestion) return;
  spinning = true;
  spinBtn.disabled = true;
  spinBtn.classList.remove("ready");
  selectedTeamEl.textContent = "Spinning... 🎵";
  activeTeam = null;
  renderTeams();

  const chosen = Math.floor(Math.random()*4);
  const centers = [45,135,225,315];
  const targetNorm = (360 - centers[chosen]) % 360;
  const currentNorm = ((currentRotation % 360)+360)%360;
  const delta = ((targetNorm - currentNorm + 360) % 360) + 360*6;
  currentRotation += delta;

  let clicks = 0;
  const tickTimer = setInterval(()=>{
    spinSound();
    clicks++;
    if(clicks>20) clearInterval(tickTimer);
  },110);

  wheel.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(()=>{
    clearInterval(tickTimer);
    spinning = false;
    activeTeam = chosen;
    selectedTeamEl.innerHTML = `🎯 <b>${teams[chosen].name}</b> is chosen!`;
    renderTeams();
    tone(720,.18,"sine",.06);
    setTimeout(()=>showQuestion(),450);
  },4300);
});

function endGame(){
  spinBtn.disabled = true;
  spinBtn.classList.remove("ready");
  nextBtn.classList.remove("show");
  const maxScore = Math.max(...teams.map(t=>t.score));
  const winners = teams.filter(t=>t.score===maxScore);
  const names = winners.map(t=>t.name).join(" & ");
  roundBadge.textContent = "🏁 GAME OVER";
  questionArea.innerHTML = `
    <div class="eyebrow">FINAL RESULT</div>
    <div class="winner">🏆 ${names}</div>
    <div class="statement" style="font-size:clamp(26px,3vw,42px);margin-top:4px">
      ${winners.length>1 ? "It’s a tie!" : "Congratulations!"} — ${maxScore} points
    </div>
    <div class="placeholder">Click <b>Reset game</b> to play again.</div>
  `;
  selectedTeamEl.textContent = "🎊 All 7 statements done!";
  confetti(160);
  correctSound();
}

function resetGame(){
  teams.forEach(t=>t.score=0);
  activeTeam=null; currentQuestion=null; usedQuestions=[]; answered=false; roundCount=0; spinning=false;
  currentRotation = 0;
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(0deg)";
  void wheel.offsetWidth;
  wheel.style.transition = "transform 4.2s cubic-bezier(.16,.73,.18,1)";
  selectedTeamEl.textContent = "Spin the wheel to choose a team.";
  roundBadge.textContent = "✨ Ready!";
  questionArea.innerHTML = `<div class="placeholder">👆 Spin the wheel. The chosen team answers one <b>True / False</b> statement.</div>`;
  spinBtn.disabled=false; spinBtn.classList.add("ready");
  nextBtn.classList.remove("show");
  renderTeams(); renderProgress();
}

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("Reset all scores and questions?")) resetGame();
});
document.getElementById("soundBtn").addEventListener("click", e=>{
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? "🔊 Sound: ON" : "🔇 Sound: OFF";
  if(soundOn) tone(520,.1);
});
document.getElementById("fullscreenBtn").addEventListener("click", ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

function confetti(n=60){
  const palette = ["#ffea61","#59f0c5","#ff6fa3","#6bc6ff","#ffffff","#b68cff"];
  for(let i=0;i<n;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=palette[Math.floor(Math.random()*palette.length)];
    c.style.setProperty("--drift",(Math.random()*260-130)+"px");
    c.style.animationDuration=(2.2+Math.random()*2.3)+"s";
    c.style.animationDelay=(Math.random()*.35)+"s";
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5200);
  }
}

function makeStars(){
  const s=document.getElementById("stars");
  for(let i=0;i<46;i++){
    const e=document.createElement("i");
    e.className="star";
    e.style.left=Math.random()*100+"%";
    e.style.top=Math.random()*100+"%";
    e.style.animationDelay=(Math.random()*2.5)+"s";
    e.style.animationDuration=(1.8+Math.random()*2.4)+"s";
    s.appendChild(e);
  }
}

makeStars();
updateWheelLabels();
renderTeams();
renderProgress();
</script>
</body>
